<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitGuard AI - Pro System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-xl w-full bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700">

        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-blue-400 tracking-wide">Fitness Tracker</h1>
            <p class="text-slate-400 text-sm mt-1">Smart Workout Logger & Injury Prevention System</p>
        </div>

        <!-- Auth Section -->
        <div id="authSection" class="mb-6 p-4 bg-slate-900 rounded-xl border border-slate-700">
            <h2 class="text-lg font-semibold text-blue-300 mb-3">1. User Account</h2>
            <div class="flex gap-2 mb-2">
                <input type="text" id="usernameInput" placeholder="Username"
                    class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
                <input type="password" id="passwordInput" placeholder="Password"
                    class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
            </div>
            <div class="flex gap-2">
                <button onclick="registerUser()"
                    class="flex-1 bg-slate-700 hover:bg-slate-600 text-xs py-2 rounded-lg font-medium transition">Register</button>
                <button onclick="loginUser()"
                    class="flex-1 bg-blue-600 hover:bg-blue-500 text-xs py-2 rounded-lg font-medium transition">Login</button>
            </div>
        </div>

        <!-- Custom Rules Section -->
        <div id="ruleSection" class="mb-6 p-4 bg-slate-900 rounded-xl border border-slate-700 hidden">
            <h2 class="text-lg font-semibold text-blue-300 mb-2">2. Custom Rules Engine</h2>
            <div class="flex items-center gap-3">
                <label class="text-xs text-slate-300">Max Weight Jump Allowed:</label>
                <select id="ruleSelect"
                    class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-200">
                    <option value="1.10">10% (Strict)</option>
                    <option value="1.25" selected>25% (Standard)</option>
                    <option value="1.40">40% (Aggressive)</option>
                </select>
                <button onclick="updateRule()"
                    class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg font-medium transition">Save
                    Rule</button>
            </div>
        </div>

        <!-- Workout Form -->
        <form id="workoutForm" class="space-y-4 hidden">
            <h2 class="text-lg font-semibold text-blue-300">3. Log Workout</h2>
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Select Exercise</label>
                <select id="targetSelect" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200"></select>
            </div>
            <div class="flex gap-3">
                <div class="flex-1">
                    <label class="block text-xs font-medium text-slate-300 mb-1">Weight (kg)</label>
                    <input type="number" id="weightInput" step="0.5" required placeholder="50"
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
                </div>
                <div class="flex-1">
                    <label class="block text-xs font-medium text-slate-300 mb-1">Reps</label>
                    <input type="number" id="repsInput" required placeholder="10"
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200">
                </div>
            </div>
            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-lg text-sm">
                Log & Analyze Safety
            </button>
        </form>

        <!-- Result Box -->
        <div id="resultBox" class="hidden mt-4 p-3 rounded-lg text-xs font-medium"></div>
    </div>

    <script>
        let currentUser = null;

        async function registerUser() {
            const u = document.getElementById('usernameInput').value;
            const p = document.getElementById('passwordInput').value;
            try {
                const res = await fetch(`/api/auth/register?username=${u}&password=${p}`, { method: 'POST' });
                if (res.ok) alert("Registered successfully! Now login.");
                else alert("Username already exists or error.");
            } catch (e) { alert("Error connecting to server"); }
        }

        async function loginUser() {
            const u = document.getElementById('usernameInput').value;
            const p = document.getElementById('passwordInput').value;
            try {
                const res = await fetch(`/api/auth/login?username=${u}&password=${p}`, { method: 'POST' });
                if (res.ok) {
                    currentUser = await res.json();
                    document.getElementById('ruleSection').classList.remove('hidden');
                    document.getElementById('workoutForm').classList.remove('hidden');
                    loadTargets();
                } else {
                    alert("Invalid credentials");
                }
            } catch (e) { alert("Login failed"); }
        }

        async function updateRule() {
            if (!currentUser) return;
            const threshold = document.getElementById('ruleSelect').value;
            try {
                const res = await fetch(`/api/auth/rule?userId=${currentUser.id}&threshold=${threshold}`, { method: 'POST' });
                if (res.ok) {
                    currentUser = await res.json();
                    alert("Custom rule updated successfully!");
                }
            } catch (e) { alert("Failed to update rule"); }
        }

        async function loadTargets() {
            try {
                const response = await fetch('/api/workouts/targets');
                const targets = await response.json();
                const select = document.getElementById('targetSelect');
                select.innerHTML = '';
                targets.forEach(t => {
                    const option = document.createElement('option');
                    option.value = t.id;
                    option.textContent = t.name;
                    select.appendChild(option);
                });
            } catch (err) { console.error("Failed to load targets", err); }
        }

        document.getElementById('workoutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const targetId = document.getElementById('targetSelect').value;
            const weight = document.getElementById('weightInput').value;
            const reps = document.getElementById('repsInput').value;
            const resultBox = document.getElementById('resultBox');

            try {
                const res = await fetch(`/api/workouts/log?userId=${currentUser.id}&targetId=${targetId}&weight=${weight}&reps=${reps}`, {
                    method: 'POST'
                });
                const message = await res.text();

                resultBox.classList.remove('hidden');
                if (message.includes('WARNING')) {
                    resultBox.className = "mt-4 p-3 rounded-lg text-xs font-medium bg-rose-950/80 border border-rose-500 text-rose-200";
                } else {
                    resultBox.className = "mt-4 p-3 rounded-lg text-xs font-medium bg-emerald-950/80 border border-emerald-500 text-emerald-200";
                }
                resultBox.textContent = message;
            } catch (err) {
                resultBox.classList.remove('hidden');
                resultBox.className = "mt-4 p-3 rounded-lg text-xs font-medium bg-rose-950/80 border border-rose-500 text-rose-200";
                resultBox.textContent = "Error communicating with server.";
            }
        });
    </script>
</body>

</html>
