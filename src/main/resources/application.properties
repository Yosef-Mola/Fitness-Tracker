# 1. Save the database to a physical file (instead of memory)
spring.datasource.url=jdbc:h2:file:./fitness_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# 2. Update the schema instead of dropping it on restart!
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 3. Enable H2 Console (optional, so you can view your DB in the browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console